name: Deploy to VDS

on:
  push:
    branches: main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VDS_HOST }}
          username: ${{ secrets.VDS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script_stop: true
          script: |
            set -e
            cd /var/DutySchedule
            git config --global --add safe.directory /var/DutySchedule
            git pull
            if docker ps -a --format '{{.Names}}' | grep -q "^DutySchedule$"; then
              docker restart DutySchedule
            else
              docker run -d --name DutySchedule -p 80:80 -v $(pwd):/usr/share/nginx/html:ro nginx:alpine
            fi