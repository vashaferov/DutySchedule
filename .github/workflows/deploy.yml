name: Deploy to VDS

on:
  push:
    branches: main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r api/requirements.txt
          pip install pytest pytest-asyncio httpx

      - name: Run tests
        env:
          DATABASE_URL: sqlite:///./test.db
          SECRET_KEY: test-secret
        run: |
          pytest api/tests -v

  deploy:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VDS_HOST }}
          username: ${{ secrets.VDS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script_stop: true
          script: |
            set -ex
            echo "🚀 Starting deployment..."
            echo "Current user: $(whoami)"
            echo "Home: $HOME"

            git --version || { echo "❌ Git not installed!"; exit 1; }

            # Определяем команду Docker Compose
            if command -v docker-compose &> /dev/null; then
                DOCKER_COMPOSE="docker-compose"
            elif docker compose version &> /dev/null 2>&1; then
                DOCKER_COMPOSE="docker compose"
            else
                echo "❌ Neither docker-compose nor docker compose found!"
                exit 1
            fi
            echo "Using Docker Compose: $DOCKER_COMPOSE"

            mkdir -p ~/duty
            cd ~/duty

            # Клонируем или обновляем код
            set +e
            if [ -d .git ]; then
                echo "Pulling latest changes..."
                git pull
            else
                echo "Cloning repository..."
                rm -rf ./* 2>/dev/null
                git clone https://github.com/${{ github.repository }} .
            fi
            set -e

            if [ ! -f docker-compose.yml ]; then
                echo "❌ docker-compose.yml not found!"
                ls -la
                exit 1
            fi

            echo "Creating .env file..."
            umask 077
            cat > ~/duty/.env << EOF
            DB_NAME=${{ secrets.DB_NAME }}
            DB_USER=${{ secrets.DB_USER }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            SPREADSHEET_ID=${{ secrets.SPREADSHEET_ID }}
            GOOGLE_SHEETS_CREDENTIALS=${{ secrets.GOOGLE_SHEETS_CREDENTIALS }}
            DATABASE_URL=postgresql://${{ secrets.DB_USER }}:${{ secrets.DB_PASSWORD }}@postgres:5432/${{ secrets.DB_NAME }}
            EOF
            chmod 600 ~/duty/.env

            echo "Pulling images..."
            $DOCKER_COMPOSE pull

            echo "Starting containers..."
            $DOCKER_COMPOSE up -d --force-recreate --build --remove-orphans

            # Проверка, инициализирована ли БД (есть ли таблица users)
            echo "Checking if database is initialized..."
            if $DOCKER_COMPOSE exec -T postgres psql -U ${{ secrets.DB_USER }} -d ${{ secrets.DB_NAME }} -c "SELECT 1 FROM users LIMIT 1;" &>/dev/null; then
                echo "⏭️ База данных уже инициализирована, миграция не требуется."
            else
                echo "🔄 Запускаем миграцию данных..."
                $DOCKER_COMPOSE run --rm migrate
                echo "✅ Миграция завершена"
            fi

            echo "✅ Deployment completed successfully."