name: Deploy to VDS

on:
  push:
    branches: main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r api/requirements.txt
          pip install pytest pytest-asyncio httpx

      - name: Run tests
        env:
          DATABASE_URL: sqlite:///./test.db
          SECRET_KEY: test-secret
        run: |
          pytest api/tests -v

      # Регрессия на stored XSS: проверяет, что функции рендера из frontend/index.html
      # экранируют данные из БД. Node предустановлен на раннерах GitHub.
      - name: Frontend XSS checks
        run: node tests/frontend/xss.test.js

      - name: Bash syntax and script checks
        run: |
          bash -n scripts/backup-db.sh scripts/restore-db.sh scripts/install-backup-cron.sh scripts/rotate-nginx-logs.sh scripts/rollback.sh
          bash tests/scripts/deploy-guards.test.sh
          bash tests/scripts/rotate-nginx-logs.test.sh
          bash tests/scripts/rollback.test.sh

      # nginx-конфиг — единственный файл, опечатка в котором уносит весь сайт,
      # а не только API. Проверяем его настоящим nginx -t в контейнере.
      - name: Nginx config check
        run: bash tests/nginx/check-config.sh

      # docker-compose.yml — второй такой файл: ошибка в нём ломает деплой
      # целиком. Проверяем, что он разбирается и что у сервисов есть healthcheck
      # и ограничение логов (иначе новый сервис тихо останется без них).
      - name: Docker Compose config check
        run: bash tests/compose/check-compose.sh

      # Установка cron для бэкапов: проверяем, что задача ставится и не
      # дублируется. Реальный crontab не трогаем — он подменён заглушкой.
      - name: Backup cron installer test
        run: bash tests/scripts/install-backup-cron.test.sh

      # Прогон самого скрипта деплоя: ssh-action со script_stop переписывает
      # его (вставляет проверки кода возврата), и часть конструкций из-за этого
      # ломается — так падали деплои 85de881 (ветка else) и a7b6b9c (case).
      # Здесь это воспроизводится локально, с заглушками вместо git/docker.
      - name: Deploy script simulation
        run: bash tests/scripts/deploy-simulation.test.sh

  deploy:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VDS_HOST }}
          username: ${{ secrets.VDS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script_stop: true
          script: |
            set -ex
            echo "🚀 Starting deployment..."
            echo "Current user: $(whoami)"
            echo "Home: $HOME"

            git --version || { echo "❌ Git not installed!"; exit 1; }

            # Определяем команду Docker Compose.
            # ВАЖНО (проверено на деплоях 85de881 и a7b6b9c): ssh-action со
            # script_stop режет скрипт на строки и после каждой вставляет
            #   DRONE_SSH_PREV_COMMAND_EXIT_CODE=$? ; if [ $... -ne 0 ]; then exit $...; fi;
            # Из-за этого в этом файле нельзя:
            #   * case — вставка ломает разбор: "syntax error near `;'";
            #   * else — вставка идёт первой строкой ветки и видит код 1 от
            #     ложного условия, после чего завершает деплой.
            # Поэтому вместо if/else — цепочки простых if.
            DOCKER_COMPOSE=""
            if command -v docker-compose &> /dev/null; then
                DOCKER_COMPOSE="docker-compose"
            fi
            if [ -z "$DOCKER_COMPOSE" ]; then
                if docker compose version &> /dev/null 2>&1; then
                    DOCKER_COMPOSE="docker compose"
                fi
            fi
            if [ -z "$DOCKER_COMPOSE" ]; then
                echo "❌ Neither docker-compose nor docker compose found!"
                exit 1
            fi
            echo "Using Docker Compose: $DOCKER_COMPOSE"

            mkdir -p ~/duty
            cd ~/duty

            # Клонируем или обновляем код. Вместо if/else — два независимых if:
            # ветка else в этом скрипте обрывает деплой (см. пояснение ниже).
            set +e
            if [ -d .git ]; then
                echo "Pulling latest changes..."
                git pull
            fi
            if [ ! -d .git ]; then
                echo "Cloning repository..."
                rm -rf ./* 2>/dev/null
                git clone https://github.com/${{ github.repository }} .
            fi
            set -e

            if [ ! -f docker-compose.yml ]; then
                echo "❌ docker-compose.yml not found!"
                ls -la
                exit 1
            fi

            echo "Creating .env file..."
            umask 077

            # Ключ подписи токенов. Деплой гарантирует непустое значение: с пустым
            # ключом все токены умирают при каждом перезапуске API.
            # Про ограничения этого файла (только if без else и без case) — выше.
            JWT_SECRET_VALUE="${{ secrets.JWT_SECRET }}"
            if [ -z "$JWT_SECRET_VALUE" ]; then
                # Прежний ключ из .env: он не должен меняться от деплоя к деплою.
                JWT_SECRET_VALUE=$(sed -n 's/^JWT_SECRET=//p' ~/duty/.env 2>/dev/null | head -n1)
            fi
            if [ -z "$JWT_SECRET_VALUE" ]; then
                JWT_SECRET_VALUE=$(head -c 32 /dev/urandom | od -An -tx1 | tr -d ' \n')
                echo "⚠️  JWT_SECRET не задан в секретах GitHub — сгенерирован и сохранён в ~/duty/.env"
            fi

            cat > ~/duty/.env << EOF
            DB_NAME=${{ secrets.DB_NAME }}
            DB_USER=${{ secrets.DB_USER }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            JWT_SECRET=$JWT_SECRET_VALUE
            SPREADSHEET_ID=${{ secrets.SPREADSHEET_ID }}
            GOOGLE_SHEETS_CREDENTIALS=${{ secrets.GOOGLE_SHEETS_CREDENTIALS }}
            DATABASE_URL=postgresql://${{ secrets.DB_USER }}:${{ secrets.DB_PASSWORD }}@postgres:5432/${{ secrets.DB_NAME }}
            EOF
            chmod 600 ~/duty/.env

            # Бэкап БД ДО пересоздания контейнеров. Откат кода не возвращает
            # данные: если новая версия испортит записи, нужен дамп на момент
            # деплоя, а не вчерашний из cron. На первом деплое контейнера ещё
            # нет — шаг пропускается (том pgdata создаётся ниже).
            if [ "$(docker inspect -f '{{.State.Running}}' duty_postgres 2>/dev/null)" = "true" ]; then
                echo "Бэкап БД перед деплоем..."
                bash ~/duty/scripts/backup-db.sh
            fi

            echo "Pulling images..."
            $DOCKER_COMPOSE pull

            echo "Starting containers..."
            $DOCKER_COMPOSE up -d --force-recreate --build --remove-orphans

            # Ждём, пока API поднимется: схему БД создаёт он сам (create_all в main.py),
            # поэтому раньше, чем отвечает /api/health, проверять таблицы бессмысленно.
            echo "Waiting for API to become healthy..."
            api_ready=0
            for i in $(seq 1 30); do
                if $DOCKER_COMPOSE exec -T api python -c "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2).status == 200 else 1)" &>/dev/null; then
                    api_ready=1
                    echo "✅ API отвечает"
                    break
                fi
                sleep 2
            done
            if [ "$api_ready" != "1" ]; then
                echo "❌ API не поднялся за 60 секунд. Логи: $DOCKER_COMPOSE logs --tail=50 api"
                exit 1
            fi

            # nginx — второй файл, ошибка в котором роняет сайт целиком, хотя API
            # при этом жив. `up -d` не замечает, что nginx ушёл в перезапуск из-за
            # плохого конфига, поэтому проверяем HTTPS изнутри контейнера.
            # curl/wget в образе нет, python3 есть (на нём работает certbot).
            # /healthz есть и в старом конфиге (отдаст index.html с кодом 200),
            # так что проверка не сломает откат на версию до этой ручки.
            nginx_ready=0
            for i in $(seq 1 30); do
                if $DOCKER_COMPOSE exec -T nginx python3 -c "import ssl,urllib.request,sys; ctx=ssl._create_unverified_context(); sys.exit(0 if urllib.request.urlopen('https://127.0.0.1/healthz', timeout=2, context=ctx).status == 200 else 1)" &>/dev/null; then
                    nginx_ready=1
                    echo "✅ nginx отвечает по HTTPS"
                    break
                fi
                sleep 2
            done
            if [ "$nginx_ready" != "1" ]; then
                echo "❌ nginx не отвечает по HTTPS. Логи: $DOCKER_COMPOSE logs --tail=50 nginx"
                echo "   Откат: bash ~/duty/scripts/rollback.sh <точка отката> (список — без аргумента)"
                exit 1
            fi

            # Проверяем, есть ли в базе пользователи (таблицы к этому моменту уже созданы).
            # ВАЖНО: ничего не стираем и не мигрируем автоматически — импорт из Google
            # Sheets перезаписывает данные, это ручное осознанное действие.
            users_count=$($DOCKER_COMPOSE exec -T postgres psql -U ${{ secrets.DB_USER }} -d ${{ secrets.DB_NAME }} -tAc "SELECT count(*) FROM users;" 2>/dev/null | tr -d '[:space:]')
            # Пустой ответ (база ещё не принимает запросы) считаем пустой базой.
            if [ -z "$users_count" ]; then
                users_count="0"
            fi
            if [ "$users_count" = "0" ]; then
                echo "⚠️  База пустая: пользователей нет, войти в приложение некому."
                echo "   Залить данные из Google Sheets (может стереть текущее — см. RUNBOOK.md):"
                echo "     cd ~/duty"
                echo "     docker compose --profile tools run --rm migrate"
                echo "   Восстановить из бэкапа: см. RUNBOOK.md"
            fi
            if [ "$users_count" != "0" ]; then
                echo "✅ База инициализирована, пользователей: $users_count"
            fi

            # Бэкапы БД: ставим/обновляем ежедневный cron. Без бэкапов потеря
            # диска = потеря всех данных. Как восстановиться — RUNBOOK.md.
            # Логика в отдельном скрипте: у него нет ограничений script_stop.
            bash ~/duty/scripts/install-backup-cron.sh

            # После каждого деплоя остаётся предыдущий образ без тега (up --build
            # собирает новый). Убираем только висячие образы: те, что нужны
            # запущенным контейнерам, не трогаются.
            docker image prune -f

            echo "✅ Deployment completed successfully."