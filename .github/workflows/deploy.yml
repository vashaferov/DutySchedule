name: Deploy to VDS

on:
  push:
    branches: main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VDS_HOST }}
          username: ${{ secrets.VDS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script_stop: true
          script: |
            set -e
            echo "🚀 Starting deployment..."

            # Переходим в папку проекта
            mkdir -p /var/duty
            cd /var/duty

            # Клонируем или обновляем код
            if [ -d .git ]; then
              git pull
            else
              git clone https://github.com/${{ github.repository }} .
            fi

            # Создаём .env с секретами
            cat > /var/duty/.env << EOF
            DB_NAME=${{ secrets.DB_NAME }}
            DB_USER=${{ secrets.DB_USER }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            SPREADSHEET_ID=${{ secrets.SPREADSHEET_ID }}
            GOOGLE_SHEETS_CREDENTIALS=${{ secrets.GOOGLE_SHEETS_CREDENTIALS }}
            DATABASE_URL=postgresql://${{ secrets.DB_USER }}:${{ secrets.DB_PASSWORD }}@postgres:5433/${{ secrets.DB_NAME }}
            EOF

            # Пересобираем и перезапускаем контейнеры
            docker compose pull
            docker compose up -d --force-recreate --build

            # Миграция только при первом деплое
            if [ ! -f /var/duty/.migrated ]; then
                echo "🔄 Запускаем миграцию данных..."
                docker compose run --rm migrate
                touch /var/duty/.migrated
                echo "✅ Миграция завершена"
            else
                echo "⏭️ Миграция уже выполнена, пропускаем."
            fi

            echo "✅ Deployment completed successfully."