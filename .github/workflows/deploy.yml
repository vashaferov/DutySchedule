name: Deploy to VDS

on:
  push:
    branches: main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VDS_HOST }}
          username: ${{ secrets.VDS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script_stop: true
          script: |
            set -ex
            echo "🚀 Starting deployment..."
            echo "Current user: $(whoami)"
            echo "Home: $HOME"

            git --version || { echo "❌ Git not installed!"; exit 1; }

            DOCKER_COMPOSE="docker-compose"

            mkdir -p ~/duty
            cd ~/duty

            # Клонируем или обновляем код
            if git rev-parse --git-dir >/dev/null 2>&1; then
                echo "Pulling latest changes..."
                git pull
            else
                echo "Cloning repository..."
                # Если папка не пуста, очищаем её
                rm -rf ./* 2>/dev/null || true
                git clone https://github.com/${{ github.repository }} .
            fi

            # Проверяем наличие docker-compose.yml
            if [ ! -f docker-compose.yml ]; then
                echo "❌ docker-compose.yml not found!"
                ls -la
                exit 1
            fi

            # Создаём .env с секретами
            echo "Creating .env file..."
            cat > ~/duty/.env << EOF
            DB_NAME=${{ secrets.DB_NAME }}
            DB_USER=${{ secrets.DB_USER }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            SPREADSHEET_ID=${{ secrets.SPREADSHEET_ID }}
            GOOGLE_SHEETS_CREDENTIALS=${{ secrets.GOOGLE_SHEETS_CREDENTIALS }}
            DATABASE_URL=postgresql://${{ secrets.DB_USER }}:${{ secrets.DB_PASSWORD }}@postgres:5432/${{ secrets.DB_NAME }}
            EOF

            echo "Pulling images..."
            $DOCKER_COMPOSE pull

            echo "Starting containers..."
            $DOCKER_COMPOSE up -d --force-recreate --build

            # Миграция только при первом деплое
            if [ ! -f ~/duty/.migrated ]; then
                echo "🔄 Запускаем миграцию данных..."
                $DOCKER_COMPOSE run --rm migrate || echo "⚠️ Migration failed, but continuing..."
                touch ~/duty/.migrated
                echo "✅ Миграция завершена"
            else
                echo "⏭️ Миграция уже выполнена, пропускаем."
            fi

            echo "✅ Deployment completed successfully."