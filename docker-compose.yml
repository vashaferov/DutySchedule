version: '3.8'

services:
  # База данных PostgreSQL
  postgres:
    image: postgres:15
    container_name: duty_postgres
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # ТОЛЬКО localhost: база не должна быть доступна из интернета.
      # Если отладка не нужна — уберите блок ports целиком.
      - "5433:5432"
    networks:
      - duty_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Бэкенд FastAPI
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: duty_api
    environment:
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
      # Внимание: код пока НЕ использует SECRET_KEY (нет токен-авторизации).
      # Переменная прокидывается из JWT_SECRET, т.к. именно его кладёт .env/CI.
      # Заполните JWT_SECRET перед тем, как включать выдачу токенов.
      SECRET_KEY: ${JWT_SECRET:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://mediahlg.ru}
      # Ключ Google Sheets здесь НЕ нужен: api его не использует.
      # Он передаётся только в сервисы sync и migrate — не расширяем поверхность утечки.
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - duty_network
    restart: unless-stopped
    # порт не публикуется, доступен только через Nginx

  # Синхронизатор с Google Sheets (фоновый процесс)
  sync:
    build:
      context: ./sync
      dockerfile: Dockerfile
    container_name: duty_sync
    environment:
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
      GOOGLE_SHEETS_CREDENTIALS: ${GOOGLE_SHEETS_CREDENTIALS}
      SPREADSHEET_ID: ${SPREADSHEET_ID}
      SYNC_INTERVAL: 60
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - duty_network
    restart: unless-stopped
    # credentials.json НЕ монтируем: ключ берётся из GOOGLE_SHEETS_CREDENTIALS (.env),
    # а bind-mount отсутствующего файла Docker превращает в КАТАЛОГ и ломает запуск.
    # Файл sync/credentials.json остаётся только фолбэком для локального запуска.
    ports:
      - "127.0.0.1:8001:8001"   # доступен только локально
    command: ["python", "sync.py", "--http"]

  # Прокси Nginx (отдаёт статику и проксирует API)
  nginx:
    image: jonasal/nginx-certbot:latest
    container_name: duty_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:rw
      - ./frontend:/usr/share/nginx/html:ro
      - ./certbot-etc:/etc/letsencrypt
      - ./certbot-var:/var/lib/letsencrypt
      - ./certbot-www:/var/www/certbot  
    environment:
      - DOMAINS=mediahlg.ru
      - CERTBOT_EMAIL=jonirz55@gmail.com
      - STAGING=false
    depends_on:
      - api
    networks:
      - duty_network
    restart: unless-stopped

  # migrate:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile.migrate
  #   environment:
  #     DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
  #     SPREADSHEET_ID: ${SPREADSHEET_ID}
  #     GOOGLE_SHEETS_CREDENTIALS: ${GOOGLE_SHEETS_CREDENTIALS}
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #   networks:
  #     - duty_network
  #   restart: "no"

networks:
  duty_network:
    driver: bridge

volumes:
  pgdata: