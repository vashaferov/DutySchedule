<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>График дежурств</title>
  <style>
    /* ---------- Общие сбросы и шрифты ---------- */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
      background: #f8fafc;
      padding: 24px 16px;
      color: #0f172a;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container {
      max-width: 1000px;
      width: 100%;
    }

    /* ---------- Заголовок ---------- */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 24px;
    }

    .header h1 {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .header .badge {
      background: #e2e8f0;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 14px;
      color: #1e293b;
      font-weight: 500;
    }

    .info {
      background: #f1f5f9;
      border-radius: 12px;
      padding: 12px 18px;
      margin-bottom: 24px;
      font-size: 14px;
      color: #334155;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .info strong {
      font-weight: 600;
    }

    /* ---------- Таблица (карточный стиль) ---------- */
    .table-wrapper {
      background: #ffffff;
      border-radius: 20px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.02);
      overflow-x: auto;
      padding: 4px 0 4px 0;
    }

    table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      font-size: 15px;
      min-width: 600px;
    }

    /* Заголовки */
    thead th {
      background: #f1f5f9;
      color: #1e293b;
      font-weight: 600;
      padding: 16px 12px;
      text-align: center;
      border-bottom: 2px solid #e2e8f0;
      font-size: 14px;
      letter-spacing: 0.3px;
      text-transform: uppercase;
    }

    thead th:first-child {
      border-top-left-radius: 20px;
      text-align: left;
      padding-left: 20px;
    }

    thead th:last-child {
      border-top-right-radius: 20px;
    }

    /* Строки */
    tbody tr {
      transition: background 0.2s;
    }

    tbody tr:not(:last-child) td {
      border-bottom: 1px solid #f1f5f9;
    }

    tbody td {
      padding: 14px 12px;
      text-align: center;
      vertical-align: middle;
      background: #ffffff;
      transition: all 0.2s;
    }

    tbody td:first-child {
      text-align: left;
      padding-left: 20px;
      font-weight: 600;
      color: #1e293b;
      background: #fafcff;
      position: relative;
    }

    /* Ячейки с датой – контейнер для прогресса */
    .date-cell {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .date-text {
      font-weight: 600;
    }

    .progress-wrapper {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: #64748b;
    }

    .progress-bar {
      flex: 1;
      height: 4px;
      background: #e2e8f0;
      border-radius: 4px;
      overflow: hidden;
      min-width: 40px;
    }

    .progress-fill {
      height: 100%;
      background: #4f46e5;
      border-radius: 4px;
      transition: width 0.3s ease;
      width: 0%;
    }

    .progress-fill.full {
      background: #22c55e;
    }

    /* Ячейки с именами (кликабельные) */
    .cell {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 44px;
      height: 44px;
      border-radius: 12px;
      font-weight: 500;
      font-size: 18px;
      cursor: pointer;
      transition: all 0.15s ease;
      border: 2px solid transparent;
      user-select: none;
      background: #f1f5f9;
      color: #94a3b8;
    }

    .cell.selected {
      background: #dbeafe;
      border-color: #4f46e5;
      color: #4f46e5;
      box-shadow: 0 4px 6px -2px rgba(79, 70, 229, 0.2);
    }

    .cell.selected:hover {
      background: #c7d2fe;
      transform: scale(1.05);
    }

    .cell:not(.selected):not(.disabled):hover {
      background: #e2e8f0;
      transform: scale(1.05);
      border-color: #cbd5e1;
    }

    .cell.disabled {
      background: #f1f5f9;
      color: #cbd5e1;
      cursor: not-allowed;
      opacity: 0.5;
      border-color: transparent;
      pointer-events: none;
    }

    /* Подсветка строки, когда заполнены 2 */
    tbody tr.row-full td:first-child {
      background: #f0fdf4;
    }

    tbody tr.row-full td:first-child .date-text {
      color: #16a34a;
    }

    tbody tr.row-full td:first-child .progress-fill {
      background: #22c55e;
    }

    /* Анимация при клике */
    .cell:active:not(.disabled) {
      transform: scale(0.92);
    }

    /* ---------- Загрузка ---------- */
    #loading {
      text-align: center;
      padding: 40px;
      color: #64748b;
      font-size: 16px;
    }

    .spinner {
      display: inline-block;
      width: 24px;
      height: 24px;
      border: 3px solid #e2e8f0;
      border-top-color: #4f46e5;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-right: 10px;
      vertical-align: middle;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* ---------- Адаптивность ---------- */
    @media (max-width: 640px) {
      body {
        padding: 12px 8px;
      }
      .header h1 {
        font-size: 22px;
      }
      .table-wrapper {
        border-radius: 16px;
        padding: 0;
      }
      thead th,
      tbody td {
        padding: 10px 8px;
        font-size: 13px;
      }
      .cell {
        width: 36px;
        height: 36px;
        font-size: 15px;
        border-radius: 8px;
      }
      .date-text {
        font-size: 13px;
      }
      .progress-wrapper {
        font-size: 10px;
        gap: 4px;
      }
      .progress-bar {
        min-width: 20px;
      }
    }

    @media (max-width: 480px) {
      table {
        font-size: 12px;
        min-width: 400px;
      }
      .cell {
        width: 30px;
        height: 30px;
        font-size: 13px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Шапка -->
    <div class="header">
      <h1>📅 График дежурств</h1>
      <span class="badge">макс. 2 человека</span>
    </div>

    <!-- Информация -->
    <div class="info">
      <span>ℹ️</span>
      <span>
        <strong>Клик</strong> по ячейке — добавить/убрать дежурного.
        Когда выбрано <strong>2</strong> человека, остальные блокируются.
      </span>
    </div>

    <!-- Таблица -->
    <div id="loading" class="table-wrapper">
      <div style="padding:20px; text-align:center;">
        <span class="spinner"></span> Загрузка...
      </div>
    </div>
    <div id="table-container" style="display:none;"></div>
  </div>

  <script>
    const API_URL = 'https://script.google.com/macros/s/AKfycbyUtlDVyQ0SeO52VSvCtL4bhpTRZzkgz-BsLF3viYQymJvopQZHPw26euzm_Ng8njg/exec';

    // ---------- Загрузка данных ----------
    async function loadData() {
      const loading = document.getElementById('loading');
      const container = document.getElementById('table-container');
      try {
        const resp = await fetch(API_URL);
        if (!resp.ok) throw new Error('Ошибка загрузки');
        const data = await resp.json();
        // Проверка на ошибку от скрипта
        if (data.error) throw new Error(data.error);

        renderTable(data);
        loading.style.display = 'none';
        container.style.display = 'block';
      } catch (e) {
        loading.innerHTML = `<div style="color:#ef4444; padding:20px;">❌ ${e.message}</div>`;
        console.error(e);
      }
    }

    // ---------- Рендер таблицы ----------
    function renderTable(data) {
      const { dates, names, matrix } = data;
      const container = document.getElementById('table-container');

      let html = `
        <div class="table-wrapper">
          <table>
            <thead>
              <tr>
                <th>Дата</th>
                ${names.map(name => `<th>${name}</th>`).join('')}
              </tr>
            </thead>
            <tbody>
      `;

      for (let i = 0; i < dates.length; i++) {
        const dateStr = dates[i];
        const row = matrix[i] || [];
        const checkedCount = row.filter(v => v === true).length;

        // Прогресс
        const percent = Math.min((checkedCount / 2) * 100, 100);
        const fillClass = checkedCount === 2 ? 'full' : '';

        html += `<tr data-date="${dateStr}" data-count="${checkedCount}">`;

        // Ячейка с датой + прогресс
        html += `
          <td>
            <div class="date-cell">
              <span class="date-text">${formatDate(dateStr)}</span>
              <div class="progress-wrapper">
                <span>${checkedCount}/2</span>
                <div class="progress-bar">
                  <div class="progress-fill ${fillClass}" style="width:${percent}%;"></div>
                </div>
              </div>
            </div>
          </td>
        `;

        // Ячейки с именами
        for (let j = 0; j < names.length; j++) {
          const checked = row[j] === true;
          const name = names[j];
          const cellClass = checked ? 'cell selected' : 'cell';
          const display = checked ? '✔' : '•';
          // data-атрибуты для обработчиков
          html += `
            <td>
              <span class="${cellClass}" 
                    data-date="${dateStr}" 
                    data-name="${name}" 
                    data-checked="${checked}">
                ${display}
              </span>
            </td>
          `;
        }

        html += '</tr>';
      }

      html += `
            </tbody>
          </table>
        </div>
      `;

      container.innerHTML = html;

      // Применяем начальное состояние блокировок
      updateRowStates();

      // Вешаем обработчики на все ячейки
      document.querySelectorAll('.cell').forEach(cell => {
        cell.addEventListener('click', toggleCell);
      });
    }

    // ---------- Форматирование даты ----------
    function formatDate(date) {
      if (typeof date === 'string') {
        const d = new Date(date);
        if (!isNaN(d)) {
          return `${d.getDate().toString().padStart(2,'0')}.${(d.getMonth()+1).toString().padStart(2,'0')}.${d.getFullYear()}`;
        }
        return date;
      }
      if (date instanceof Date) {
        const d = date.getDate().toString().padStart(2, '0');
        const m = (date.getMonth() + 1).toString().padStart(2, '0');
        const y = date.getFullYear();
        return `${d}.${m}.${y}`;
      }
      return String(date);
    }

    // ---------- Обновление состояния строк (блокировки + прогресс) ----------
    function updateRowStates() {
      const rows = document.querySelectorAll('tbody tr');
      rows.forEach(tr => {
        const cells = tr.querySelectorAll('.cell');
        let checkedCount = 0;

        // Считаем выбранные
        cells.forEach(cell => {
          if (cell.dataset.checked === 'true') checkedCount++;
        });

        // Обновляем прогресс в первой ячейке
        const progressFill = tr.querySelector('.progress-fill');
        const countSpan = tr.querySelector('.progress-wrapper span');
        if (progressFill) {
          const percent = Math.min((checkedCount / 2) * 100, 100);
          progressFill.style.width = percent + '%';
          if (checkedCount === 2) {
            progressFill.classList.add('full');
          } else {
            progressFill.classList.remove('full');
          }
        }
        if (countSpan) {
          countSpan.textContent = `${checkedCount}/2`;
        }

        // Подсветка строки
        if (checkedCount === 2) {
          tr.classList.add('row-full');
        } else {
          tr.classList.remove('row-full');
        }

        // Блокировка ячеек
        if (checkedCount >= 2) {
          cells.forEach(cell => {
            if (cell.dataset.checked !== 'true') {
              cell.classList.add('disabled');
            } else {
              cell.classList.remove('disabled');
            }
          });
        } else {
          cells.forEach(cell => {
            cell.classList.remove('disabled');
          });
        }
      });
    }

    // ---------- Обработчик клика по ячейке ----------
    async function toggleCell(event) {
      const cell = event.currentTarget;

      // Если заблокирована — игнорируем
      if (cell.classList.contains('disabled')) return;

      const date = cell.dataset.date;
      const name = cell.dataset.name;
      const currentChecked = cell.dataset.checked === 'true';
      const newValue = !currentChecked;

      // Оптимистичное обновление UI
      cell.dataset.checked = String(newValue);
      cell.textContent = newValue ? '✔' : '•';
      if (newValue) {
        cell.classList.add('selected');
      } else {
        cell.classList.remove('selected');
      }

      // Пересчитываем состояние строк (прогресс, блокировки)
      updateRowStates();

      // Отправка на сервер (без ожидания ответа из-за no-cors)
      try {
        await fetch(API_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ date, name, value: newValue })
        });
      } catch (e) {
        // Ошибка — откатываем
        alert('Ошибка сохранения. Попробуйте ещё раз.');
        cell.dataset.checked = String(currentChecked);
        cell.textContent = currentChecked ? '✔' : '•';
        if (currentChecked) {
          cell.classList.add('selected');
        } else {
          cell.classList.remove('selected');
        }
        updateRowStates();
        console.error(e);
      }
    }

    // Запуск
    loadData();
  </script>
</body>
</html>
